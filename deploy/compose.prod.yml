# Production overlay for a single host (4 vCPU / 8 GB, next to a mail node).
#
#   docker compose --env-file /opt/mailexpert/.env \
#     -f docker-compose.yml -f deploy/compose.prod.yml up -d
#
# Requires Docker Compose 2.24.4+ (!override, !reset).
#
# - Images come from GHCR, tagged sha-<first 12 characters of the commit>; MAILEXPERT_VERSION
#   must name the commit that is checked out next to this file.
# - build is removed on purpose: with both build and image, a failed pull silently falls back
#   to building on the host. Emergency build from source: `docker build -f backend/Dockerfile
#   -t <image>:<MAILEXPERT_VERSION> .` (same for frontend/Dockerfile), then `up` uses the local
#   image.
# - The frontend serves plain HTTP on loopback only; the edge (Caddy or cloudflared) terminates
#   TLS and sends X-Forwarded-Proto. PostgreSQL and Redis publish no host ports.
# - CPU caps are optional: BACKEND_CPUS, TENANT_WORKER_CPUS and POSTGRES_CPUS in .env (for example
#   1.5) limit a host shared with other projects. 0, the default, means no cap; Docker refuses a
#   value above the host's CPU count, so the default must stay 0.

services:
  frontend:
    image: ${MAILEXPERT_IMAGE_PREFIX:-ghcr.io/wyrtensi}/mailexpert-frontend:${MAILEXPERT_VERSION:?set MAILEXPERT_VERSION to the sha-<commit> image tag}
    build: !reset null
    ports: !override
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"

  backend:
    image: ${MAILEXPERT_IMAGE_PREFIX:-ghcr.io/wyrtensi}/mailexpert-backend:${MAILEXPERT_VERSION:?set MAILEXPERT_VERSION to the sha-<commit> image tag}
    build: !reset null
    mem_limit: 1536m
    cpus: ${BACKEND_CPUS:-0}
    environment:
      NODE_OPTIONS: --max-old-space-size=1024
      # The edge (Caddy or cloudflared) and the frontend's nginx both append to X-Forwarded-For:
      # two hops to the client's address, which the sign-in rate limit keys on
      # (backend/src/utils/trustProxy.js).
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # Update from the panel (docs/architecture/deployment-system.md, section 9): the backend
      # writes requests into request/ and reads the host's results from result/ (read-only). The
      # host directories are made by install.sh, which also writes UPDATE_SPOOL_HOST_DIR to .env.
      UPDATE_SPOOL_DIR: /var/lib/mailexpert/update-spool
    volumes:
      - ${UPDATE_SPOOL_HOST_DIR:-/opt/mailexpert/state/update-spool}/request:/var/lib/mailexpert/update-spool/request
      - ${UPDATE_SPOOL_HOST_DIR:-/opt/mailexpert/state/update-spool}/result:/var/lib/mailexpert/update-spool/result:ro

  # Optional (profile "tenant", docker-compose.yml): pulled and started only with
  # COMPOSE_PROFILES=tenant.
  tenant-worker:
    image: ${MAILEXPERT_IMAGE_PREFIX:-ghcr.io/wyrtensi}/mailexpert-tenant-worker:${MAILEXPERT_VERSION:?set MAILEXPERT_VERSION to the sha-<commit> image tag}
    build: !reset null
    mem_limit: 768m
    cpus: ${TENANT_WORKER_CPUS:-0}

  postgres:
    mem_limit: 2g
    cpus: ${POSTGRES_CPUS:-0}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - random_page_cost=1.1

  redis:
    # The base command plus a memory cap. noeviction: sessions must never be dropped silently;
    # at the cap Redis refuses writes instead.
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy noeviction
