name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Plugin boundary
        working-directory: backend
        run: npm run lint:plugins

      - name: Syntax check
        working-directory: backend
        run: node --check src/index.js

      - name: Test
        working-directory: backend
        run: npm test

      - name: Audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Shellcheck
        run: |
          mapfile -t files < <(git ls-files 'scripts/*.sh' 'deploy/*.sh' 'frontend/*.sh')
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"

  bats:
    name: Bats
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # jq: the mail node scripts parse the Microsoft 365 endpoints answers with it (the image has none).
      # git: status.bats runs status.sh against a throwaway checkout.
      - name: Deploy script unit tests
        run: docker run --rm -v "$PWD:/code:ro" -w /code --entrypoint bash bats/bats:1.14.0 -c 'apk add --no-cache -q jq git && bats scripts/deploy/test'

  fake-eop:
    name: Stand fake-EOP
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Unit tests of the fake EOP relay (needs openssl, which the runner has)
        run: node --test scripts/deploy/test/fake-eop/eop.test.mjs

  tenant-worker:
    name: Tenant worker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # The runner has openssl and pwsh: the whitelist, the handler and the dry-mode tests of the
      # real worker (R-35, R-36) run here without the image.
      - name: Unit and dry-mode tests
        run: node --test deploy/tenant-worker/worker.test.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/tenant-worker
          platforms: linux/amd64
          load: true
          tags: local.invalid/mailexpert-tenant-worker:ci
          provenance: false
          cache-from: type=gha,scope=tenant-worker

      # The same tests inside the image (pwsh 7.5, the module imported as the worker user), on a
      # read-only root file system as docker-compose.yml runs it.
      - name: Tests in the image
        run: docker run --rm --read-only --tmpfs /tmp --entrypoint node local.invalid/mailexpert-tenant-worker:ci --test /app/worker.test.mjs

  deploy-e2e:
    name: Deploy e2e
    needs: [shellcheck, bats]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          # e2e.sh installs HEAD from a git bundle, which needs the history.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Image tag
        id: image
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${sha::12}" >> "$GITHUB_OUTPUT"

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local.invalid/mailexpert-backend:${{ steps.image.outputs.tag }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=backend

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local.invalid/mailexpert-frontend:${{ steps.image.outputs.tag }}
          provenance: false
          build-args: |
            VITE_BUILD_SHA=${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=frontend

      - name: Edge image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/edge
          platforms: linux/amd64
          load: true
          tags: local.invalid/mailexpert-edge:${{ steps.image.outputs.tag }}
          provenance: false
          cache-from: type=gha,scope=edge

      - name: Deploy e2e
        run: scripts/deploy/test/e2e.sh --version "${{ steps.image.outputs.tag }}" --image-prefix local.invalid

  images:
    name: Images
    needs: [backend, frontend, shellcheck, bats, fake-eop, tenant-worker, deploy-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Images are published only for commits on main; pull requests build them without pushing.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Image tag
        id: image
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.image.outputs.prefix }}/mailexpert-backend:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.image.outputs.prefix }}/mailexpert-frontend:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Edge image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/edge
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.image.outputs.prefix }}/mailexpert-edge:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

      # Optional (compose profile "tenant"): amd64 only, its base image has no arm64.
      - name: Tenant worker image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/tenant-worker
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.image.outputs.prefix }}/mailexpert-tenant-worker:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=tenant-worker
          cache-to: type=gha,mode=max,scope=tenant-worker
