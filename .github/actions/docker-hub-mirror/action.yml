name: Docker Hub through mirror.gcr.io
description: >
  Pulls of Docker Hub images go through Google's pull-through cache first (Docker falls back to
  Docker Hub when the mirror lacks an image), so the runners' shared, unauthenticated Docker Hub
  pull limit and Docker Hub outages do not fail the jobs. Builds with buildx read the same mirror
  from .github/buildkitd.toml.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        conf=/etc/docker/daemon.json
        current=$(sudo cat "$conf" 2>/dev/null || echo '{}')
        jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' <<<"$current" | sudo tee "$conf" >/dev/null
        sudo systemctl restart docker
        docker info --format '{{.RegistryConfig.Mirrors}}'
