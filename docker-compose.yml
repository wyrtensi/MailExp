services:

  # ── Frontend (nginx — serves React SPA + proxies API) ───────────────────────
  # Default mode: exposes HTTPS on APP_PORT and HTTP on APP_HTTP_PORT.
  # HTTP is intended for use behind a reverse proxy that terminates TLS.
  # Production mode (--profile https): Caddy handles TLS instead (see below)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BUILD_SHA: ${GIT_SHA:-dev}
        VITE_EMAIL_DIV_RENDER: ${VITE_EMAIL_DIV_RENDER:-false}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        NGINX_BASE: ${NGINX_BASE:-nginx:alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-mailexpert}-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-443}:443"
      - "${APP_HTTP_PORT:-80}:80"
    volumes:
      - ./certs:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mailexpert

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_SHA: ${GIT_SHA:-dev}
    container_name: ${COMPOSE_PROJECT_NAME:-mailexpert}-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-}
      APP_ALT_URLS: ${APP_ALT_URLS:-}
      FRONTEND_URL: ${APP_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mailexpert}
      DB_USER: ${DB_USER:-mailexpert}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      IMAP_MAX_PERSISTENT_PER_HOST: ${IMAP_MAX_PERSISTENT_PER_HOST:-}
      IMAP_CONNECT_CONCURRENCY: ${IMAP_CONNECT_CONCURRENCY:-}
      IMAP_POOL_IDLE_SECONDS: ${IMAP_POOL_IDLE_SECONDS:-}
      DNS_CHECK_RESOLVER: ${DNS_CHECK_RESOLVER:-}
      AUTH_MODE: ${AUTH_MODE:-local}
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-}
      CF_ACCESS_AUDIENCE: ${CF_ACCESS_AUDIENCE:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      # Fallback Google callback URL; the one saved on the Google apps screen takes precedence.
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # api (default): a Gmail mailbox sends over the Gmail API, falling back to SMTP only when
      # the API definitely did not accept the message. smtp: always use SMTP for Gmail, like
      # every other provider. See docs/operations/google-oauth.md.
      GMAIL_SEND_TRANSPORT: ${GMAIL_SEND_TRANSPORT:-}
      # The Microsoft tenant (EOP stage 7a): the tenant worker below and the shared secret both
      # sides know (32+ characters). Empty: no tenant driver, the tenant steps stay manual. See
      # docs/operations/mail-node.md, "Microsoft tenant".
      TENANT_WORKER_URL: ${TENANT_WORKER_URL:-}
      TENANT_WORKER_TOKEN: ${TENANT_WORKER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mailexpert

  # ── Tenant worker (Microsoft tenant, optional) ───────────────────────────────
  # EXO PowerShell behind a whitelist of typed operations (deploy/tenant-worker). Only with
  # COMPOSE_PROFILES=tenant; installs without a tenant never start or pull it. The application
  # certificate (PFX) is mounted read-only from TENANT_CERT_DIR (app.pfx), its password is a
  # compose secret from TENANT_PFX_PASSWORD_FILE; the worker refuses to start without either.
  # No host port: the backend reaches it as http://tenant-worker:8080 (TENANT_WORKER_URL).
  tenant-worker:
    profiles: ["tenant"]
    build:
      context: deploy/tenant-worker
    container_name: ${COMPOSE_PROJECT_NAME:-mailexpert}-tenant-worker
    restart: unless-stopped
    environment:
      TENANT_WORKER_TOKEN: ${TENANT_WORKER_TOKEN:-}
    volumes:
      - ${TENANT_CERT_DIR:-./tenant-cert}:/certs:ro
    secrets:
      - tenant_pfx_password
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - mailexpert

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mailexpert}-postgres
    restart: unless-stopped
    # PUID/PGID default to 0:0 (root), identical to the image's normal behaviour.
    # Set them (e.g. 99:100 on Unraid) only when bind-mounting POSTGRES_DATA to a host
    # share, and chown that share to the same uid:gid first.
    user: "${PUID:-0}:${PGID:-0}"
    # Parallel queries, parallel VACUUM and parallel CREATE INDEX share memory through /dev/shm.
    # Docker's 64 MB default fails them with "could not resize shared memory segment ... No space
    # left on device" once `messages` reaches a few million rows (measured at 3.5M rows, 8 GB).
    shm_size: 256m
    environment:
      POSTGRES_DB: ${DB_NAME:-mailexpert}
      POSTGRES_USER: ${DB_USER:-mailexpert}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${POSTGRES_DATA:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailexpert -d mailexpert"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mailexpert

  # ── Redis (sessions + caching) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mailexpert}-redis
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ${REDIS_DATA:-redis_data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - mailexpert

  # ── Caddy (automatic HTTPS via Let's Encrypt — production only) ──────────────
  # Use docker-compose.https.yml to avoid the port conflict with the frontend:
  #   docker compose -f docker-compose.yml -f docker-compose.https.yml --profile https up -d --build
  # Requires DOMAIN, ACME_EMAIL, and APP_URL to be set in .env, and ports 80/443 to be open.
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mailexpert}-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - mailexpert

secrets:
  # Read only by the tenant worker (profile "tenant"); compose resolves the file only for the
  # services that start.
  tenant_pfx_password:
    file: ${TENANT_PFX_PASSWORD_FILE:-./tenant-cert/app.pfx.password}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  mailexpert:
    driver: bridge
